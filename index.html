<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bộ Sưu Tập & Tải Truyện</title>
  <!-- Nhúng Thư Viện Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 16px 12px 40px; }
    
    .tab-wrapper { position: sticky; top: 12px; z-index: 100; width: 100%; max-width: 480px; margin-bottom: 24px; }
    .nav-tabs { display: flex; background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(12px); padding: 4px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.1); gap: 4px; }
    .tab-btn { flex: 1; padding: 10px 8px; border: none; border-radius: 12px; background: transparent; font-size: 0.85rem; font-weight: 600; color: #94a3b8; cursor: pointer; text-align: center; white-space: nowrap; }
    .tab-btn.active { background: linear-gradient(135deg, #2563eb, #3b82f6); color: #fff; }

    .feed-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 20px; }
    .page-content { display: none; flex-direction: column; gap: 20px; }
    .page-content.active { display: flex; }

    .card { background: #1e293b; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.08); overflow: hidden; }
    .card-header { padding: 14px 16px; font-size: 0.95rem; font-weight: 600; color: #e2e8f0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .card-content { width: 100%; background-color: #000; display: flex; justify-content: center; align-items: center; }
    .card-content img, .card-content video { width: 100%; max-height: 550px; object-fit: contain; }

    /* Thanh chỉnh âm lượng tùy chỉnh */
    .volume-control-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 16px;
      background: #0f172a;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .volume-label { font-size: 0.85rem; color: #94a3b8; font-weight: 500; }
    .volume-slider { flex: 1; accent-color: #3b82f6; cursor: pointer; height: 6px; }

    /* Thiết kế nút Tải File ZIP Truyện */
    .zip-card-body { padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; background: #0f172a; text-align: center; }
    .zip-icon { font-size: 2.5rem; }
    .btn-download { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px; background: linear-gradient(135deg, #10b981, #059669); color: white; text-decoration: none; font-weight: 600; font-size: 0.95rem; border-radius: 12px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }

    .status-box { text-align: center; padding: 40px 20px; background: #1e293b; border-radius: 20px; color: #94a3b8; }
  </style>
</head>
<body>

  <!-- Thanh Điều Hướng Tab -->
  <div class="tab-wrapper">
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchPage('video-page', this)">🎬 Video</button>
      <button class="tab-btn" onclick="switchPage('image-page', this)">🖼️ Ảnh</button>
      <button class="tab-btn" onclick="switchPage('zip-page', this)">📦 Truyện ZIP</button>
    </div>
  </div>

  <!-- Danh Sách Nội Dung -->
  <div class="feed-container">
    <div id="video-page" class="page-content active"><div class="status-box">Đang tải...</div></div>
    <div id="image-page" class="page-content"><div class="status-box">Đang tải...</div></div>
    <div id="zip-page" class="page-content"><div class="status-box">Đang tải...</div></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://mzulupuvaslegxclsyck.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16dWx1cHV2YXNsZWd4Y2xzeWNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MzQxMzQsImV4cCI6MjEwNDExMDEzNH0.0iz8DsFpxGoWnELDd3F4ONqRNgG0nwkKzsYHoh2B-x0';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadMedia() {
      const { data, error } = await supabaseClient.from('media').select('*').order('id', { ascending: false });
      const videoPage = document.getElementById('video-page');
      const imagePage = document.getElementById('image-page');
      const zipPage = document.getElementById('zip-page');

      if (error || !data || data.length === 0) {
        videoPage.innerHTML = '<div class="status-box">Chưa có nội dung.</div>';
        imagePage.innerHTML = '<div class="status-box">Chưa có nội dung.</div>';
        zipPage.innerHTML = '<div class="status-box">Chưa có truyện nào.</div>';
        return;
      }

      videoPage.innerHTML = '';
      imagePage.innerHTML = '';
      zipPage.innerHTML = '';

      let hasVideo = false, hasImage = false, hasZip = false;

      data.forEach(item => {
        if (item.type === 'video') {
          hasVideo = true;
          videoPage.appendChild(createVideoCard(item));
        } else if (item.type === 'image') {
          hasImage = true;
          imagePage.appendChild(createImageCard(item));
        } else if (item.type === 'zip') {
          hasZip = true;
          zipPage.appendChild(createZipCard(item));
        }
      });

      if (!hasVideo) videoPage.innerHTML = '<div class="status-box">Chưa có video nào.</div>';
      if (!hasImage) imagePage.innerHTML = '<div class="status-box">Chưa có ảnh nào.</div>';
      if (!hasZip) zipPage.innerHTML = '<div class="status-box">Chưa có tệp ZIP nào.</div>';
    }

    // Tạo thẻ Video kèm thanh chỉnh Âm Lượng riêng
    function createVideoCard(item) {
      const card = document.createElement('div');
      card.className = 'card';
      const videoId = `vid-${item.id}`;

      card.innerHTML = `
        <div class="card-header">${item.title}</div>
        <div class="card-content" style="flex-direction: column;">
          <video id="${videoId}" controls playsinline preload="metadata">
            <source src="${item.url}" type="video/mp4">
            Trình duyệt của bạn không hỗ trợ phát video.
          </video>
          <div class="volume-control-bar">
            <span class="volume-label">🔊 Âm lượng:</span>
            <input type="range" class="volume-slider" min="0" max="1" step="0.05" value="1" 
                   oninput="document.getElementById('${videoId}').volume = this.value">
          </div>
        </div>
      `;
      return card;
    }

    function createImageCard(item) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-header">${item.title}</div>
        <div class="card-content">
          <img src="${item.url}" loading="lazy" alt="${item.title}">
        </div>
      `;
      return card;
    }

    function createZipCard(item) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-header">${item.title}</div>
        <div class="zip-card-body">
          <div class="zip-icon">📚</div>
          <a href="${item.url}" class="btn-download" download target="_blank">
            ⬇️ Tải Về File Truyện (.ZIP)
          </a>
        </div>
      `;
      return card;
    }

    function switchPage(pageId, btnElement) {
      document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      btnElement.classList.add('active');
    }

    loadMedia();
  </script>
</body>
</html>

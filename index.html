<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển Văn Bản Thành Giọng Nói</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 700px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: #007bff;
        }

        .controls {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
        }

        select, input[type="range"] {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
        }

        .range-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .range-container span {
            font-size: 14px;
            min-width: 35px;
            font-weight: bold;
            color: #007bff;
        }

        .buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        #btn-speak {
            background-color: #28a745;
            color: white;
        }

        #btn-speak:hover {
            background-color: #218838;
        }

        #btn-pause {
            background-color: #ffc107;
            color: #333;
        }

        #btn-pause:hover {
            background-color: #e0a800;
        }

        #btn-stop {
            background-color: #dc3545;
            color: white;
        }

        #btn-stop:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Ứng Dụng Đọc Văn Bản</h1>
    
    <textarea id="text-input" placeholder="Nhập hoặc dán văn bản của bạn vào đây (không giới hạn độ dài)..."></textarea>

    <div class="controls">
        <div class="control-group">
            <label for="voice-select">Chọn Giọng Nói:</label>
            <select id="voice-select">
                <option value="">Đang tải danh sách giọng...</option>
            </select>
        </div>

        <div class="control-group">
            <label for="rate">Tốc độ đọc: <span id="rate-val">1x</span></label>
            <div class="range-container">
                <input type="range" id="rate" min="0.5" max="2" value="1" step="0.1">
            </div>
        </div>
    </div>

    <div class="buttons">
        <button id="btn-speak">▶ Đọc</button>
        <button id="btn-pause">⏸ Tạm dừng</button>
        <button id="btn-stop">⏹ Dừng lại</button>
    </div>
</div>

<script>
    const synth = window.speechSynthesis;
    const textInput = document.getElementById('text-input');
    const voiceSelect = document.getElementById('voice-select');
    const rateInput = document.getElementById('rate');
    const rateVal = document.getElementById('rate-val');

    const btnSpeak = document.getElementById('btn-speak');
    const btnPause = document.getElementById('btn-pause');
    const btnStop = document.getElementById('btn-stop');

    let voices = [];

    // Lấy danh sách các giọng đọc hỗ trợ trên trình duyệt
    function populateVoiceList() {
        voices = synth.getVoices();
        voiceSelect.innerHTML = '';

        if (voices.length === 0) {
            const option = document.createElement('option');
            option.textContent = 'Không tìm thấy giọng đọc nào';
            voiceSelect.appendChild(option);
            return;
        }

        // Ưu tiên đưa các giọng tiếng Việt lên đầu
        voices.sort((a, b) => {
            if (a.lang.includes('vi') && !b.lang.includes('vi')) return -1;
            if (!a.lang.includes('vi') && b.lang.includes('vi')) return 1;
            return 0;
        });

        voices.forEach((voice, index) => {
            const option = document.createElement('option');
            option.textContent = `${voice.name} (${voice.lang})`;
            option.setAttribute('data-index', index);
            
            // Tự động chọn giọng tiếng Việt đầu tiên tìm thấy
            if (voice.lang.includes('vi')) {
                option.selected = true;
            }
            
            voiceSelect.appendChild(option);
        });
    }

    populateVoiceList();
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = populateVoiceList;
    }

    // Cập nhật hiển thị tốc độ
    rateInput.addEventListener('input', () => {
        rateVal.textContent = `${rateInput.value}x`;
    });

    // Chia văn bản dài thành các câu nhỏ để tránh lỗi bị dừng giữa chừng của Web Speech API
    function splitText(text) {
        // Tách câu dựa trên dấu chấm, dấu chấm hỏi, dấu cảm thán hoặc xuống dòng
        return text.match(/[^.!?\n]+[.!?\n]+/g) || [text];
    }

    let isSpeaking = false;

    // Hàm đọc văn bản
    function speak() {
        if (synth.speaking) {
            if (synth.paused) {
                synth.resume();
                btnPause.textContent = '⏸ Tạm dừng';
                return;
            } else {
                alert("Đang đọc... Nếu muốn đọc lại từ đầu, hãy nhấn nút 'Dừng lại' trước.");
                return;
            }
        }

        const text = textInput.value.trim();
        if (text === '') {
            alert('Vui lòng nhập văn bản cần đọc!');
            return;
        }

        // Tách văn bản thành danh sách câu nhỏ để hỗ trợ đọc văn bản siêu dài
        const chunks = splitText(text);
        const selectedVoiceIndex = voiceSelect.selectedOptions[0]?.getAttribute('data-index');
        const selectedVoice = voices[selectedVoiceIndex];

        chunks.forEach((chunk, index) => {
            const utterThis = new SpeechSynthesisUtterance(chunk);
            if (selectedVoice) {
                utterThis.voice = selectedVoice;
            }
            utterThis.rate = parseFloat(rateInput.value);

            // Khi kết thúc câu cuối cùng
            if (index === chunks.length - 1) {
                utterThis.onend = () => {
                    isSpeaking = false;
                    btnPause.textContent = '⏸ Tạm dừng';
                };
            }

            synth.speak(utterThis);
        });

        isSpeaking = true;
    }

    // Nút Đọc
    btnSpeak.addEventListener('click', speak);

    // Nút Tạm dừng / Tiếp tục
    btnPause.addEventListener('click', () => {
        if (synth.speaking) {
            if (synth.paused) {
                synth.resume();
                btnPause.textContent = '⏸ Tạm dừng';
            } else {
                synth.pause();
                btnPause.textContent = '▶ Tiếp tục';
            }
        }
    });

    // Nút Dừng lại
    btnStop.addEventListener('click', () => {
        if (synth.speaking) {
            synth.cancel();
            btnPause.textContent = '⏸ Tạm dừng';
        }
    });
</script>

</body>
</html>
